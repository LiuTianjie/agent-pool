name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-pool-production
  cancel-in-progress: false

env:
  LUMA_CONTROL_URL: ${{ vars.LUMA_CONTROL_URL }}
  LUMA_DEPLOY_TOKEN: ${{ secrets.LUMA_DEPLOY_TOKEN }}
  LUMA_VERSION: 0.1.271

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentpool_test
          POSTGRES_USER: agentpool_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentpool_test -d agentpool_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://agentpool_test:test-only-password@127.0.0.1:5432/agentpool_test

      - name: Resolve GHCR image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "tag=${image_name}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Luma CLI
        run: python -m pip install --disable-pip-version-check "luma-infra==${LUMA_VERSION}"

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LUMA_CONTROL_URL" || { echo "Missing repository variable LUMA_CONTROL_URL" >&2; exit 1; }
          test -n "$LUMA_DEPLOY_TOKEN" || { echo "Missing repository secret LUMA_DEPLOY_TOKEN" >&2; exit 1; }

      - name: Render immutable deployment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-ci-deployment.mjs \
            "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Authorize Luma to copy the GHCR image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | luma registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Validate Luma deployment
        run: |
          luma compose validate luma.ci.compose.yml --format json
          luma storage check luma.ci.compose.yml --format json

      - name: Deploy immutable image
        run: luma compose deploy luma.ci.compose.yml --format ndjson --timeout 3000

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 https://agentpool.itool.tech/healthz >/dev/null; then
              break
            fi
            if test "$attempt" -eq 24; then
              echo "Production health check did not recover" >&2
              exit 1
            fi
            sleep 5
          done
          curl -fsS --max-time 10 https://agentpool.itool.tech/api/meta/capabilities \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.protocolVersion!=='agentpool-control/1')process.exit(1)})"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Agent Pool production"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`"
            echo "- Site: https://agentpool.itool.tech"
            echo "- Storage: manager-local ReadWriteOnce volume"
          } >> "$GITHUB_STEP_SUMMARY"
