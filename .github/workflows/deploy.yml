name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-pool-production
  cancel-in-progress: false

env:
  LUMA_CONTROL_URL: ${{ vars.LUMA_CONTROL_URL }}
  LUMA_DEPLOY_TOKEN: ${{ secrets.LUMA_DEPLOY_TOKEN }}
  LUMA_VERSION: 0.2.79
  LUMA_BUILD_URL: ${{ vars.LUMA_BUILD_URL || 'https://build.itool.tech' }}

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentpool_test
          POSTGRES_USER: agentpool_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentpool_test -d agentpool_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://agentpool_test:test-only-password@127.0.0.1:5432/agentpool_test

      - name: Install Luma CLI
        run: python -m pip install --disable-pip-version-check "luma-infra==${LUMA_VERSION}"

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LUMA_CONTROL_URL" || { echo "Missing repository variable LUMA_CONTROL_URL" >&2; exit 1; }
          test -n "$LUMA_DEPLOY_TOKEN" || { echo "Missing repository secret LUMA_DEPLOY_TOKEN" >&2; exit 1; }

      - name: Build and push through independent Builder
        run: |
          luma builder submit "https://github.com/${GITHUB_REPOSITORY}.git" \
            --provider-id github:LiuTianjie --ref "$GITHUB_SHA" \
            --compose-sidecar luma.compose.yml --platform linux/amd64 \
            --no-deploy --format json > "$RUNNER_TEMP/luma-build.json"

      - name: Render immutable deployment
        id: deployment-image
        shell: bash
        run: |
          set -euo pipefail
          canonical_image="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const build = payload.result?.build;
            if (!payload.ok || build?.status !== "succeeded" || !build.result?.images?.app)
              throw new Error("Builder did not return a successful app image");
            process.stdout.write(build.result.images.app);
          ' "$RUNNER_TEMP/luma-build.json")"
          node scripts/render-ci-deployment.mjs "$canonical_image"
          echo "canonical=${canonical_image}" >> "$GITHUB_OUTPUT"

      - name: Validate Luma deployment
        run: |
          luma compose validate luma.ci.compose.yml --format json
          luma storage check luma.ci.compose.yml --format json

      - name: Deploy immutable image
        run: luma compose deploy luma.ci.compose.yml --format ndjson --timeout 3000

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 https://agentpool.itool.tech/healthz >/dev/null; then
              break
            fi
            if test "$attempt" -eq 24; then
              echo "Production health check did not recover" >&2
              exit 1
            fi
            sleep 5
          done
          curl -fsS --max-time 10 https://agentpool.itool.tech/api/meta/capabilities \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.protocolVersion!=='agentpool-control/1')process.exit(1)})"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Agent Pool production"
            echo ""
            echo "- Image: \`${{ steps.deployment-image.outputs.canonical }}\`"
            echo "- Site: https://agentpool.itool.tech"
            echo "- Storage: manager-local ReadWriteOnce volume"
          } >> "$GITHUB_STEP_SUMMARY"
